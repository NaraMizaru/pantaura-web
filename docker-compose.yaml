services:
    postgres:
        restart: always
        container_name: pantaura.postgres.local
        image: postgres:16
        environment:
            POSTGRES_USER: root
            POSTGRES_PASSWORD: root
            POSTGRES_DB: pantaura
        volumes:
            - 'postgres:/var/lib/postgresql/data'
        networks:
            - pantaura
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U root']
            retries: 3
            timeout: 5s

    redis:
        restart: always
        container_name: pantaura.redis.local
        image: redis:6.0
        networks:
            - pantaura
        volumes:
            - 'redis:/data'
        healthcheck:
            test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']

    web:
        restart: always
        container_name: pantaura.web.local
        build:
            context: .
            dockerfile: Dockerfile
        #    image: ${DOCKER_REGISTRY}/web:${IMAGE_VERSION}
        user: '${UID:-1000}:${GID:-1000}'
        ports:
            - '${DOCKER_PORT:-127.0.0.1:8000}:8000'
        volumes:
            - '.:/opt/apps/pantaura'
        depends_on:
            - postgres
        networks:
            - pantaura

networks:
    pantaura:
        name: pantaura.local
        driver: bridge

volumes:
    postgres:
        name: pantaura.postgres.local
    redis:
        name: pantaura.redis.local
