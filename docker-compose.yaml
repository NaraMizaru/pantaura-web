services:
  postgres:
    restart: always
    container_name: siagakita.postgres.local
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: siagakita
    volumes:
      - 'postgres:/var/lib/postgresql/data'
    networks:
      - siagakita
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U root" ]
      retries: 3
      timeout: 5s

  redis:
    restart: always
    container_name: siagakita.redis.local
    image: redis:6.0
    networks:
      - siagakita
    volumes:
      - 'redis:/data'
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]

  web:
    restart: always
    container_name: siagakita.web.local
    build:
      context: .
      dockerfile: Dockerfile
#    image: ${DOCKER_REGISTRY}/web:${IMAGE_VERSION}
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${DOCKER_PORT:-127.0.0.1:8000}:8000"
    volumes:
      - ".:/opt/apps/siagakita"
    depends_on:
      - postgres
    networks:
      - siagakita

#  queue:
