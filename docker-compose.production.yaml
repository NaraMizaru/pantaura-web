services:
  web:
    container_name: pantaura.web.production
#    image: ${DOCKER_REGISTRY}/web:${IMAGE_VERSION}
    build:
      context: .
      dockerfile: ops/production/Dockerfile
      target: web
    restart: always
    ports:
      - "${DOCKER_PORT:-127.0.0.1:8000}:80"
    volumes:
      - .:/opt/apps/pantaura:ro
    depends_on:
      - fpm
    networks:
      - pantaura

  fpm:
    container_name: pantaura.fpm.production
#    image: ${DOCKER_REGISTRY}/fpm:${IMAGE_VERSION}
    build:
      context: .
      dockerfile: ops/production/Dockerfile
      target: fpm
    restart: always
    volumes:
      - .:/opt/apps/pantaura
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    networks:
      - pantaura

  postgres:
    restart: always
    container_name: pantaura.postgres.local
    image: postgres:16
    environment:
        POSTGRES_USER: root
        POSTGRES_PASSWORD: root
        POSTGRES_DB: pantaura
    volumes:
        - 'postgres:/var/lib/postgresql/data'
    networks:
        - pantaura
    healthcheck:
        test: ['CMD-SHELL', 'pg_isready -U root']
        retries: 3
        timeout: 5s

  redis:
    container_name: pantaura.redis.production
    image: redis:6.0
    restart: always
    volumes:
      - redis:/data
    networks:
      - pantaura

networks:
  pantaura:
    driver: bridge

volumes:
  postgres:
    name: pantaura.postgres.production
  redis:
    name: pantaura.redis.production
